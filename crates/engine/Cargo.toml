[package]
name = "cowry-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cowry agent engine: providers, tool loop, storage. Zero UI knowledge."

# IMPORTANT: this crate must never depend on tauri, gtk, or any webview crate.
# The TUI and the desktop app are peers of each other and both talk to this.

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "fs"] }
reqwest.workspace = true
futures-util.workspace = true
async-trait.workspace = true
url.workspace = true
rusqlite.workspace = true
chrono.workspace = true
toml.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "fs", "io-util"] }
