[package]
name = "cwoffee-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local-model co-work agent: chat, tools, sandboxed commands, and document output."

# This crate is deliberately boring. If logic is accumulating here, it belongs
# in crates/engine instead.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Without `custom-protocol`, tauri's own build script sets cfg(dev) and the app
# loads build.devUrl instead of the embedded assets - so a plain
# `cargo build --release` produces a binary that shows a blank window unless a
# vite server happens to be running. `tauri build` passes this feature itself;
# `tauri dev` re-runs cargo with --no-default-features. Declaring it here (and on
# by default) is what makes `cargo build --release` produce a real artifact.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
# Opening links in the real browser. Deliberately the official plugin rather than
# an xdg-open command of our own: it validates the URL against a declared scope
# instead of handing a caller's string to a shell.
tauri-plugin-opener = "2"
# Folder picker for the workspace control. The engine validates whatever comes
# back; this only exists so the control is not a dead button.
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
cwoffee-engine.workspace = true
tokio.workspace = true
