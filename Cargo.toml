[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/tauri-app",
    "crates/tui",
    "crates/gateway",
    "crates/bridge",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/cwoffee/cwoffee"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

cwoffee-engine = { path = "crates/engine" }

# ---- M1 ----
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "http2",
    "rustls-tls-native-roots",
] }
futures-util = "0.3"
async-trait = "0.1"
url = "2"
# bundled: we ship a desktop app; depending on the distro's libsqlite3 means
# FTS5 may or may not be compiled in, and a missing virtual table is a runtime
# failure on the user's machine rather than a build failure on ours.
rusqlite = { version = "0.37", features = ["bundled", "chrono", "hooks", "limits"] }
# `hooks` and `limits` are for sheet_query, not for the session store: the
# progress handler puts a wall clock on a model-authored query, and
# SQLITE_LIMIT_ATTACHED=0 makes "read-only" a fact of the engine rather than
# a promise in a tool description. Both are rusqlite modules, no new crate.
chrono = "0.4"
toml = "0.8"

# ---- M2+ ----
# portable-pty, similar, pulldown-cmark, rust_xlsxwriter, calamine, typst

# ---------------------------------------------------------------------------
# Release profile — PLAN.md §9 rule 9.
# We ship an application, so optimise for size + startup, not just throughput.
# ---------------------------------------------------------------------------
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# `panic = "abort"` is the usual size/startup choice, but it silently voids a
# correctness guarantee we rely on: a tool that panics is caught as a JoinError
# and turned into a tool_result so the session survives. With abort there is no
# unwind, no JoinError, and the whole process dies - which is exactly the crash
# that was reported mid-session. Unwind costs a little size; the isolation is
# worth more than that.
panic = "unwind"

# Dev builds still need to be usable; keep debug info but cut some bloat.
[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 2
